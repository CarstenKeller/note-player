name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (Notenerkennung)
        run: ./gradlew :omr-core:test

      - name: APK bauen
        run: ./gradlew :app:assembleDebug

      # eindeutiger Dateiname je Build, damit kein Browser eine alte Version aus dem Cache liefert
      - name: APK benennen
        id: apk
        run: |
          name="notenspieler-0.1.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Release mit direktem Download-Link
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Notenspieler 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: ${{ steps.apk.outputs.name }}
          body: |
            Build ${{ github.run_number }} aus Commit ${{ github.sha }} (Branch ${{ github.ref_name }}).

            Direkter Download: https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/${{ steps.apk.outputs.name }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: omr-core/build/reports/tests/
