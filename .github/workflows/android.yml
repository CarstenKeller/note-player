name: Build (Android + Web)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (Notenerkennung)
        run: ./gradlew :omr-core:jvmTest

      - name: APK bauen
        run: ./gradlew :app:assembleDebug

      # eindeutiger Dateiname je Build, damit kein Browser eine alte Version aus dem Cache liefert
      - name: APK benennen
        id: apk
        run: |
          name="notenspieler-0.1.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Release mit direktem Download-Link
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Notenspieler 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: ${{ steps.apk.outputs.name }}
          body: |
            Build ${{ github.run_number }} aus Commit ${{ github.sha }} (Branch ${{ github.ref_name }}).

            Direkter Download: https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/${{ steps.apk.outputs.name }}

            Web-App (iPad, Browser): https://carstenkeller.github.io/note-player/

      # --- Web-App (iPad, Browser): die Erkennung als JavaScript, veröffentlicht auf GitHub Pages ---
      - name: Erkennung für das Web bauen
        run: ./gradlew :omr-core:jsBrowserProductionLibraryDistribution

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web-App bauen
        working-directory: web
        run: |
          npm ci
          npm test
          # der Erkennungsstand: ändert er sich, werden gespeicherte Blätter neu erkannt
          export VITE_ENGINE=$(git rev-parse HEAD:omr-core/src/commonMain)
          export VITE_BUILD="0.1.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          npm run build

      - name: Web-App veröffentlichen (Branch gh-pages)
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: Web-App ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: omr-core/build/reports/tests/
